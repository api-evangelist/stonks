name: Stonks
description: >-
  Stonks (now operating as Sandhill Markets) is a San Francisco investment
  platform, founded circa 2019-2020 by serial entrepreneur Ali Moiz, that lets
  accredited investors buy and sell shares of top pre-IPO companies on the
  private secondary market - often described as "Robinhood for private markets."
  The business is run through the SEC-registered adviser Sandhill Markets
  Advisors LLC and also publishes Sandhill Report, a venture-focused newsletter
  covering startups, funding, and the broader VC market. Surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network. As of this
  enrichment pass Sandhill Markets publishes no public developer API, OpenAPI,
  SDK, or developer portal; this profile captures the company's public identity
  and a live domain-security probe of its primary domain.
